# Custom rubocop configuration

require:
  - rubocop-rspec

AllCops:
  DisplayCopNames: true
  NewCops: enable
  Exclude:
    - deepl-rb.gemspec
    - vendor/**/*
  TargetRubyVersion: 2.7.5

Metrics/BlockLength:
  Exclude:
    - "**/*_spec.rb"

Metrics/ParameterLists:
  Max: 6

Layout/LineLength:
  Max: 100

# A real-API example is one flow per resource: each step is one real request.
RSpec/ExampleLength:
  Max: 10
  CountAsOne: ['heredoc']
  Exclude:
    - 'spec/real_api/**/*'

# The suites are named after the SDK resource or operation, not after one class.
RSpec/DescribeClass:
  inherit_mode:
    merge:
      - Exclude
  Exclude:
    - 'spec/offline/**/*'
    - 'spec/real_api/**/*'

# The expectation of an offline example is the declared request: offline_helper.rb fails every
# example whose declared request the SDK did not send.
RSpec/NoExpectationExample:
  Exclude:
    - 'spec/offline/**/*'

RSpec/MessageSpies:
  EnforcedStyle: 'receive'

RSpec/MultipleExpectations:
  Max: 8
  Exclude:
    - 'spec/real_api/**/*'

RSpec/MultipleMemoizedHelpers:
  Max: 7

RSpec/NestedGroups:
  Max: 4

RSpec/SpecFilePathSuffix:
  Enabled: false

RSpec/SpecFilePathFormat:
  inherit_mode:
    merge:
      - Exclude
  CustomTransform:
    DeepL: ''
  Exclude:
    - 'spec/offline/**/*'
    - 'spec/real_api/**/*'

Style/Documentation:
  Enabled: false

Style/ModuleFunction:
  EnforcedStyle: extend_self
