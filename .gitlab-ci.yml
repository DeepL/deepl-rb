# Note: This GitLab CI configuration is used for internal testing, users can ignore it.
include:
  - template: Security/SAST.gitlab-ci.yml
  - project: '${CI_PROJECT_NAMESPACE}/ci-libs-for-client-libraries'
    file:
      - '/${CI_PROJECT_NAME}/.gitlab-ci.yml'
  - project: 'deepl-org/deepl/devex/gitlab-ci-lib'
    file:
      - '/templates/.buildkit.yml'
      - '/templates/.secret-detection.yml'

# Global --------------------------

workflow:
  rules:
    # The tag pipeline must run: that is where the registry publish job fires.
    - if: $CI_COMMIT_TAG
    # The release commit carries only the version and the changelog, both
    # derived from commits that were already checked on the way in.
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

variables:
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

stages:
  - install
  - check
  - test
  - publish


before_script:
  - ruby --version
  - bundle install

# stage: install ----------------------

package:
  stage: install
  parallel:
      matrix:
          - DOCKER_IMAGE: 'ruby:2.7'
          - DOCKER_IMAGE: 'ruby:3.2'
          - DOCKER_IMAGE: 'ruby:3.3'
  image:
    name: ${DOCKER_IMAGE}
    entrypoint: ['/builds/deepl/backend/oss-client-libs/deepl-ruby']
  script:
    - bundle exec rake build
  artifacts:
    paths:
      - pkg/

# stage: check ----------------------

.rubocop_base:
  stage: check
  image:
    name: ruby:2.7
    entrypoint: ['/builds/deepl/backend/oss-client-libs/deepl-ruby']
  variables:
    HOME: /tmp
  script: bundle exec rubocop

rubocop_scheduled:
  extends: .rubocop_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

rubocop_manual:
  extends: .rubocop_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

secret_detection:
  extends: .secret-detection
  stage: check
  image: !reference [.secret-detection, image]
  before_script:
    - echo "overriding default before_script..."
  rules:
    - if: $CI_MERGE_REQUEST_ID

license_check:
  stage: check
  before_script:
    - echo "overriding default before_script..."
  script:
    - ./license_checker.sh '*.rb' | tee license_check_output.txt
    - '[ ! -s license_check_output.txt ]'

gitlab-advanced-sast:
  stage: check
  before_script:
    - ''
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS,/spec'
    GIT_STRATEGY: clone
    KUBERNETES_HELPER_MEMORY_LIMIT: 8Gi
    SAST_SCANNER_ALLOWED_CLI_OPTS: --multi-core 8

semgrep-sast:
  stage: check
  before_script:
    - ''
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS,/spec'
    GIT_STRATEGY: clone
    KUBERNETES_MEMORY_LIMIT: 8Gi


# stage: test ----------------------

.test_base:
    stage: test
    extends: .test
    variables:
        VALIDATE_REQUESTS_FOR_DEEPL_MOCK: '1'
        VALIDATE_RESPONSES_FOR_DEEPL_MOCK: '1'
    parallel:
        matrix:
          - DOCKER_IMAGE: 'ruby:2.7'
          - DOCKER_IMAGE: 'ruby:3.2'
          - DOCKER_IMAGE: 'ruby:3.3'
          - DOCKER_IMAGE: 'ruby:2.7'
            USE_MOCK_SERVER: "use mock server"
          - DOCKER_IMAGE: 'ruby:3.2'
            USE_MOCK_SERVER: "use mock server"
          - DOCKER_IMAGE: 'ruby:3.3'
            USE_MOCK_SERVER: "use mock server"
    image:
      name: ${DOCKER_IMAGE}
      entrypoint: ['/builds/deepl/backend/oss-client-libs/deepl-ruby']
    script:
      - >
        if [[ ! -z "${USE_MOCK_SERVER}" ]]; then
          echo "Using mock server"
          export DEEPL_SERVER_URL=http://deepl-mock:3000
          export DEEPL_MOCK_SERVER_PORT=3000
          export DEEPL_PROXY_URL=http://deepl-mock:3001
          export DEEPL_MOCK_PROXY_SERVER_PORT=3001
        fi
      - bundle exec rake test
      - bundle exec rspec --format RspecJunitFormatter --out rspec.xml
    artifacts:
        reports:
            coverage_report:
                coverage_format: cobertura
                path: coverage/coverage.xml
            junit:
                - rspec.xml
        when: always

test_scheduled:
  extends: .test_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_manual:
  stage: test
  extends: .test_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# stage: publish ----------------------

gem push:
  extends: .publish
  stage: publish
  image:
    name: ruby:3.3
    entrypoint: ['/builds/deepl/backend/oss-client-libs/deepl-ruby']
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    # The committed gemspec keeps a hardcoded s.files list. Regenerate it from
    # git ls-files; the version comes from lib/version.rb, written at release.
    - bundle exec rake gemspec
    - gem build deepl-rb.gemspec
    - GEM_HOST_API_KEY="$RUBYGEM_PUBLISH_API_KEY" gem push "deepl-rb-${CI_COMMIT_TAG#v}.gem"
